[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pt-nuts"
version = "0.1.0"
description = "Parallel-tempered NUTS sampling for NumPyro models, built directly on NumPyro's own HMC/NUTS kernel and JAX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Matteo Tagliazucchi" },
]

dependencies = [
    "jax>=0.9.0",
    "numpy>=1.25",
    "numpyro>=0.15",
]


# NOTE: install the jax build appropriate for your hardware separately, e.g.
#   pip install "jax[cuda12]"
# This package intentionally does not pin a jax[...] extra.

[project.optional-dependencies]
# Needed for verbose=True's live warmup/sampling progress bar. The PyPI
# package name is "jax-tap" (import name "jaxtap") -- do NOT `pip install
# jaxtap`, that is a different, unrelated (nonexistent) package.
progress = ["jax-tap"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/mtagliazucchi/pt-nuts"
Issues = "https://github.com/mtagliazucchi/pt-nuts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pt_nuts"]
